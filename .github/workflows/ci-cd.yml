name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Build Docker image
        run: docker build -t cicd-demo-app:latest .
      - name: Verify Docker image
        run: docker images | grep cicd-demo-app

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy notification
        run: |
          echo "Deployment step would go here."
          echo "In a real project, this connects to AWS ECS, Azure App Service, or similar."
          echo "Deployment simulated successfully."
